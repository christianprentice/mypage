baseURL = "https://flyingkiwi.xyz/"
title = "My Resume"
theme = "PaperMod"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

[params]
  defaultTheme = "auto"
  ShowThemeToggle = true

[languages]
  [languages.en]
    label = "English"
    weight = 1

    # English Top Navigation
    [[languages.en.menu.main]]
      name = "Resume"
      url = "/en/resume/"
      weight = 1

    [languages.en.params.profileMode]
      enabled = true
      title = "Hi, I'm Christian"
      subtitle = "Infrastructure Engineer"

  [languages.jp]
    label = "日本語"
    weight = 2

    # Japanese Top Navigation
    [[languages.jp.menu.main]]
      name = "履歴書"
      url = "/jp/resume/"
      weight = 1

    [languages.jp.params.profileMode]
      enabled = true
      title = "プリンティス　太朗"
      subtitle = "インフラエンジニア"
